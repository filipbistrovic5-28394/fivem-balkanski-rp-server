# Server naziv
sv_projectName "BALKANSKI ROLEPLAY SERVER"
sv_projectDesc "Balkanski Roleplay Server - ESX Framework"

# Osnovne postavke
sv_maxclients 128
sv_endserveridentifier "Balkanski RP Server"
sv_hostName "Balkanski Roleplay Server"

# Port
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# MySQL
set mysql_connection_string "mysql://root:@localhost/fivem_balkanski"

# Licence
sv_licenseKey "YOUR_LICENSE_KEY_HERE"

# Logovanje
setr mysql_debug false
setr mysql_slow_query_warn 500

# Script manifest version
ensure mapmanager
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure baseevents

# ESX Framework
ensure oxmysql
ensure es_Extended

# Gameplay Resources
ensure gathering_job
ensure robbery_sistem
ensure crafting_sistem
ensure jobs_sistem
ensure trader_sistem
ensure mechanic_job
ensure woodcutter_job
ensure mining_job
ensure fishing_job
ensure narkotik_job
ensure police_job
ensure ambulance_job
ensure car_dealer
ensure weapon_dealer
ensure bank_sistem
ensure garage_sistem
ensure shops
ensure housing
ensure police_station

# UI Resources
ensure hud_sistem
ensure menu_sistem

# Admin
ensure admin_sistem

# Razine RCON
rcon_password "vasa_super_lozinka"

# Chat
setr chat_multigrouping true

